spring:
  application:
    name: anvil

# AI extraction (#37, record 0022). The credential comes only from the
# environment; with none set, extraction answers 503 and calls no model.
# For an Anthropic-compatible API instead, set provider ANTHROPIC, its
# base-url and model, auth (X_API_KEY or BEARER) and any session-header.
anvil:
  extraction:
    provider: GEMINI
    base-url: https://generativelanguage.googleapis.com
    model: gemini-3.8-flash
    api-key: ${ANVIL_MODEL_API_KEY:}
    timeout: 30s
    max-tokens: 8192
