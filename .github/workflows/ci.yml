name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.filter.outputs.data }}
      contracts: ${{ steps.filter.outputs.contracts }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            data:
              - 'src/main/java/com/g1do/anvil/tenant/**'
              - 'src/main/java/com/g1do/anvil/jobs/**'
              - 'src/main/java/com/g1do/anvil/cas/**'
              - 'src/main/java/com/g1do/anvil/read/**'
              - 'src/main/java/com/g1do/anvil/audit/**'
              - 'src/main/java/com/g1do/anvil/outbox/**'
              - 'src/main/java/com/g1do/anvil/submit/**'
              - 'src/main/java/com/g1do/anvil/exec/**'
              - 'src/main/java/com/g1do/anvil/health/**'
              - 'src/main/resources/db/migration/**'
              - 'src/main/resources/application.yaml'
              - 'src/test/java/**'
            contracts:
              - 'docs/contracts/**'
              - 'openapi/**'
            full:
              - '.github/workflows/**'
              - 'Taskfile*'
              - 'Dockerfile*'
              - 'docker-compose*'
              - 'pom.xml'
              - '**/seed*'
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task lint
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task types
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test
  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task migrate
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for CodeQL
        run: task build
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: task check:sast
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task check:secrets
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task check:audit
  integration:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.data == 'true' || needs.changes.outputs.full == 'true' || contains(github.event.pull_request.labels.*.name, 'force-integration')
    needs: [changes, lint, types, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test:int
  e2e:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.full == 'true' || contains(github.event.pull_request.labels.*.name, 'force-e2e')
    needs: [changes, lint, types, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test:e2e
  build:
    runs-on: ubuntu-latest
    needs: [lint, types, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task build
  contract-check:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.full == 'true' || contains(github.event.pull_request.labels.*.name, 'force-contract')
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install pyyaml
      - run: task test:contract
  arch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install pyyaml
      - run: task diagrams
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install pyyaml
      - run: task check:hygiene
  gate:
    if: ${{ !cancelled() }}
    needs: [changes, lint, types, test, schema-validate, contract-check, sast, secrets-scan, audit, integration, e2e, build, arch-validate, hygiene]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -c "import json, os, sys; needs=json.loads(os.environ['NEEDS']); required={'changes','lint','test','types','schema-validate','sast','secrets-scan','audit','build','arch-validate','hygiene'}; bad=[k for k,v in needs.items() if v.get('result') in ('failure','cancelled')]; bad+=[k for k in required if needs.get(k,{}).get('result')!='success']; print(bad); sys.exit(1 if bad else 0)"
          # fail on failure/cancelled (needs.<job>.result is success|failure|cancelled|skipped per GitHub contexts docs); always-required jobs must be success — missing or skipped fails (delete N/A jobs and prune all three places: gate needs, this required set, and dependent needs like build/integration/e2e); skipped neutral only for untriggered conditional jobs (contract-check/integration/e2e)
