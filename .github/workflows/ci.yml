name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.filter.outputs.data }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            data:
              - 'src/main/java/com/g1do/anvil/tenant/**'
              - 'src/main/java/com/g1do/anvil/jobs/**'
              - 'src/main/java/com/g1do/anvil/cas/**'
              - 'src/main/java/com/g1do/anvil/read/**'
              - 'src/main/java/com/g1do/anvil/audit/**'
              - 'src/main/java/com/g1do/anvil/outbox/**'
              - 'src/main/java/com/g1do/anvil/submit/**'
              - 'src/main/java/com/g1do/anvil/exec/**'
              - 'src/main/java/com/g1do/anvil/health/**'
              - 'src/main/resources/db/migration/**'
              - 'src/main/resources/application.yaml'
              - 'src/test/java/**'
              - 'pom.xml'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'Taskfile.yml'
            contracts:
              - 'docs/contracts/**'
              - 'openapi/**'
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task lint
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task types
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test
  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task migrate
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for CodeQL
        run: task build
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  integration:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.data == 'true'
    needs: [changes, lint, types, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test:int
  e2e:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.data == 'true'
    needs: [changes, lint, types, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task e2e
  build:
    runs-on: ubuntu-latest
    needs: [lint, types, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task build
  contract-check:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.contracts == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install pyyaml
      - run: task contract-check
  diagrams-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task diagrams
  gate:
    if: always()
    needs: [lint, types, unit, schema-validate, contract-check, diagrams-validate, sast, secrets-scan, integration, e2e, build]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -c "import json, os, sys; needs=json.loads(os.environ['NEEDS']); bad=[k for k,v in needs.items() if v.get('result') in ('failure', 'cancelled')]; print(bad); sys.exit(1 if bad else 0)"
          # skipped = neutral pass; failure or cancelled = fail
