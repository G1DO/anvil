name: gate
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
# Every job runs the same `task` command a developer runs locally.
# Actions are pinned to full commit SHAs; Dependabot proposes updates.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.3'
          cache: maven
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.3'
          cache: maven
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task build
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task check:sast
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task check:secrets
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # base branch for the added-vulnerability diff
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.3'
          cache: maven
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task check:audit
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # base branch for the breaking-change diff
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test:contract
  arch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task check:diagrams
  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.3'
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task check:tla
  pr-description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Problem and Acceptance check filled in
        env:
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "pr: not a pull request, or a dependency-bot PR; exempt"
            exit 0
          fi
          task check:pr
  gate:
    # always(): a skipped or cancelled gate would count as passing for the required check.
    if: ${{ always() }}
    needs: [test, build, sast, secrets-scan, audit, contract-check, arch-validate, tla, pr-description]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded (skipped or cancelled counts as failure)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -c "import json, os, sys; needs=json.loads(os.environ['NEEDS']); bad=sorted(k for k,v in needs.items() if v.get('result')!='success'); print('not successful:', bad or 'none'); sys.exit(1 if bad else 0)"
