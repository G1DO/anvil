name: eval-nightly
on:
  schedule:
    - cron: '23 22 * * *' # nightly, in the model's off-peak price window (record 0024)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eval-nightly
  cancel-in-progress: false
# The full eval set (#79, record 0024) scored against the live model every
# night, with the same `task` commands a developer runs locally. The nightly
# model is DeepSeek V4.1 Flash through OpenCode Go. Its key is the repository
# secret ANVIL_GO_API_KEY, given only to the step that calls the model;
# without it the run fails rather than passing unscored.
# Scheduled and manual runs use the default branch only, so no pull request
# can reach the secret. A failed run opens an issue with its report; only the
# report job, which runs no build, can write issues.
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5'
          cache: maven
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract the full set with the live model and gate it
        env:
          ANVIL_MODEL_API_KEY: ${{ secrets.ANVIL_GO_API_KEY }}
          ANVIL_MODEL_BASE_URL: https://opencode.ai/inference/go/openai/v1
          ANVIL_MODEL: deepseek-v4.1-flash
        run: task eval:nightly
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-nightly
          path: target/eval/nightly/
          if-no-files-found: ignore
          retention-days: 30
  report:
    needs: [live]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A run that failed before scoring still gets an issue.
        continue-on-error: true
        with:
          name: eval-nightly
          path: target/eval/nightly
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Open an issue with the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: task eval:issue
