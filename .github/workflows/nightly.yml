name: nightly
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install pyyaml
      - run: task test
      - run: task test:int
      - run: task test:e2e
      - run: task test:contract
      - run: task build
      - run: task check:sast
      - run: task check:secrets
      - run: task check:audit
      - run: task check:hygiene
      - run: task diagrams
      - run: task verify
