name: nightly
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for oasdiff baseline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install oasdiff 1.33.0 pinned (checksum via checksums.txt per install.sh)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh -o /tmp/install-oasdiff.sh
          INSTALL_DIR="$HOME/.local/bin" version=1.33.0 sh /tmp/install-oasdiff.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: task verify
