groups:
  - name: anvil-saturation-33
    interval: 15s
    rules:
      - alert: QueueBurn
        expr: anvil_queue_age_seconds{state="queued"} > 60
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Queue age burn: oldest QUEUED age on DB clock over 60s for 5m"
      - alert: ClaimBurn
        expr: |
          anvil_claim_latency_seconds{op="claim",quantile="0.99"} > 0.5
          or
          anvil_pool_wait_seconds{pool="hikaricp",quantile="0.99"} > 0.5
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Claim or pool-wait p99 burn over 0.5s for 5m"
