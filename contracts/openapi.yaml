openapi: 3.0.3
info:
  title: anvil
  version: 0.1.0
  description: >
    Capability-secure execution fabric. OpenAPI is the source for HTTP;
    code and tests validate against it. Breaking changes bump the version
    with a compatibility check (additive-only in v1).
servers:
  - url: http://localhost:8080
paths:
  /api/documents:
    post:
      summary: Submit a document (single-transaction document+version+job+outbox)
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      responses:
        '202':
          description: Accepted (first and duplicate delivery share IDs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      summary: Title-prefix search, tenant solely from X-Tenant-Id
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - name: query
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Caller-tenant documents only (cross-tenant 0 rows, no oracle)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/documents/{id}/extract:
    post:
      summary: Extract cited facts from the caller's document once (record 0022)
      description: >
        Truncates the latest version's text to 500 characters, asks the model once,
        and indexes only facts whose citation is an exact substring of that text.
        Poison input and failing facts go to a dead-letter queue that no route serves.
        A repeat request returns the stored result without a model call.
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The stored extraction for the document's latest version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extraction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The model is unconfigured or unreachable; nothing was stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/documents/{id}/facts:
    get:
      summary: The indexed facts of the caller's document (record 0022)
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Only facts that passed the citation check; never dead letters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /audit/events:
    get:
      summary: Per-job hash-chain reads, tenant solely from X-Tenant-Id
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - name: job_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Caller-tenant chain ORDER BY seq (cross-tenant same empty [] as missing)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /audit/replay:
    get:
      summary: Deterministic replay from immutable log, tenant solely from X-Tenant-Id
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - name: job_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Caller-tenant recompute {input_sha,output_sha,match} (non-terminal match:false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: missing or cross-tenant job_id (same message, no bytes, no oracle)
  /healthz:
    get:
      summary: Liveness, no dependency checks, no auth
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /readyz:
    get:
      summary: Readiness including Postgres SELECT 1, no auth
      responses:
        '200':
          description: ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        '503':
          description: not-ready
  /observe/saturation:
    get:
      summary: Saturation signals plus burn alert evaluation, no auth, no tenant bytes
      responses:
        '200':
          description: queue_age, claim_p99, pool_wait_p99 plus alert payload
          content:
            application/json:
              schema:
                type: object
  /metrics:
    get:
      summary: Prometheus exposition for saturation signals, no auth, no tenant bytes
      responses:
        '200':
          description: prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    XTenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
    DocumentId:
      name: id
      in: path
      required: true
      description: A malformed, missing or other tenant's ID gets the same 404
      schema: { type: string }
  schemas:
    SubmitRequest:
      type: object
      required: [title, mime_type, body]
      properties:
        title: { type: string, maxLength: 4096 }
        mime_type: { type: string, maxLength: 255 }
        body: { type: string }
    SubmitResponse:
      type: object
      required: [doc_id, version_id, job_id]
      properties:
        doc_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        title: { type: string }
        mime_type: { type: string }
        created_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        job_id: { type: string, format: uuid }
        seq: { type: integer }
        prev_hash: { type: string }
        event_hash: { type: string }
        type: { type: string }
        payload: { type: object }
        created_at: { type: string, format: date-time }
    ReplayResult:
      type: object
      required: [input_sha, output_sha, match]
      properties:
        input_sha: { type: string }
        output_sha: { type: string }
        match: { type: boolean }
    Extraction:
      type: object
      required: [extraction_id, document_id, version_id, status, facts, quarantined, truncated]
      properties:
        extraction_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        status: { type: string, enum: [ACCEPTED, QUARANTINED] }
        facts: { type: integer, description: facts indexed }
        quarantined: { type: integer, description: inputs or facts sent to the dead-letter queue }
        truncated: { type: boolean, description: the text was cut to 500 characters }
    Fact:
      type: object
      required: [field, value, citation]
      properties:
        field: { type: string, enum: [party, person, date, amount] }
        value: { type: string }
        citation: { type: string, description: an exact substring of the document's first 500 characters }
    Facts:
      type: object
      required: [document_id, version_id, status, facts]
      properties:
        document_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        status: { type: string, enum: [NOT_EXTRACTED, ACCEPTED, QUARANTINED] }
        facts:
          type: array
          items:
            $ref: '#/components/schemas/Fact'
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    NotFound:
      description: Missing, malformed or another tenant's document; the same body for all
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: malformed request
    Unauthorized:
      description: missing or unknown X-Tenant-Id
