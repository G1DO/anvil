version: '3'

vars:
  BASE: origin/main
  MERMERD_VERSION: 0.13.0
  MERMERD_SHA256: 20d2f052e34f23dc0b0094fd964bd729b35d6331df41666a7fd5c37e278a1e90
  TLC_VERSION: 1.7.4
  TLC_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

tasks:
  dev:
    desc: "Run the app locally with ./mvnw spring-boot:run; starts no Postgres, so startup fails without a configured datasource"
    cmds:
      - ./mvnw spring-boot:run

  test:
    desc: "Full suite with Testcontainers and real dependencies (covers compile, lint, and migrations)"
    cmds:
      - ./mvnw -B -ntp test

  build:
    desc: Build the repeatable delivery artifact
    cmds:
      - ./mvnw -B -ntp package -DskipTests

  test:contract:
    desc: "Breaking-change check on the API contract and the schema (always runs; no-op when those paths are unchanged)"
    cmds:
      - task: test:contract:api
      - task: test:contract:schema

  test:contract:api:
    desc: "oasdiff breaking --fail-on ERR against {{.BASE}}; fails when the baseline is missing unless this change adds the spec"
    cmds:
      - |
        set -e
        git rev-parse --verify {{.BASE}} >/dev/null
        if ! git cat-file -e {{.BASE}}:contracts/openapi.yaml 2>/dev/null; then
          if git diff --name-only --diff-filter=A {{.BASE}}...HEAD -- contracts/openapi.yaml | grep -q .; then
            echo "contract: contracts/openapi.yaml is new in this change; nothing to compare"
            exit 0
          fi
          echo "contract: no baseline contracts/openapi.yaml on {{.BASE}}"
          exit 1
        fi
        mkdir -p target
        git show {{.BASE}}:contracts/openapi.yaml > target/openapi-base.yaml
        docker run --rm -v "$PWD:/src" -w /src tufin/oasdiff:v1.33.0 breaking --fail-on ERR --err-ignore contracts/oasdiff-ignore.txt target/openapi-base.yaml contracts/openapi.yaml

  test:contract:schema:
    desc: "Fail when an existing migration is edited or removed, or a new one has a destructive step not listed in contracts/schema-breaks.txt"
    cmds:
      - |
        set -e
        git rev-parse --verify {{.BASE}} >/dev/null
        mkdir -p target
        git diff --name-status --no-renames {{.BASE}}...HEAD -- src/main/resources/db/migration > target/schema-diff.txt
        python3 - target/schema-diff.txt contracts/schema-breaks.txt <<'EOF'
        import pathlib, re, sys
        diff = pathlib.Path(sys.argv[1]).read_text().splitlines()
        allowed = {l.split("#")[0].strip() for l in pathlib.Path(sys.argv[2]).read_text().splitlines()} - {""}
        destructive = re.compile(r"\b(DROP\s+(TABLE|COLUMN|VIEW|SCHEMA|TYPE|CONSTRAINT|POLICY|TRIGGER|FUNCTION|INDEX)|RENAME|TRUNCATE|DELETE\s+FROM|SET\s+NOT\s+NULL|ALTER\s+COLUMN\s+\S+\s+(SET\s+DATA\s+)?TYPE)\b", re.I)
        bad = []
        for line in diff:
            status, path = line.split("\t", 1)
            name = pathlib.Path(path).name
            if status != "A":
                bad.append(f"{path}: existing migration {'removed' if status == 'D' else 'edited'}; add a new migration instead")
                continue
            sql = re.sub(r"--[^\n]*|/\*.*?\*/", "", pathlib.Path(path).read_text(), flags=re.S)
            hits = sorted({m.group(0).upper() for m in destructive.finditer(sql)})
            if hits and name not in allowed:
                bad.append(f"{path}: destructive step {hits}; list it in contracts/schema-breaks.txt if this is the contract step of expand -> migrate -> contract")
        print("\n".join(bad) if bad else "schema: no breaking migration changes")
        sys.exit(1 if bad else 0)
        EOF

  check:sast:
    desc: "Static analysis via Semgrep registry p/default --error, minus rules that only flagged parameterized SQL and the jail's validated argv"
    cmds:
      - docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.180.0 semgrep scan --config p/default --error --metrics off
        --exclude-rule java.lang.security.audit.sqli.tainted-sql-from-http-request.tainted-sql-from-http-request
        --exclude-rule java.lang.security.audit.command-injection-process-builder.command-injection-process-builder
        src/main/java

  check:secrets:
    desc: "Secret scan of the full git history via gitleaks (exits 1 on leaks)"
    cmds:
      - docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact -v

  check:audit:
    desc: "Fail on vulnerable dependencies this change adds vs {{.BASE}} (existing ones are fixed through Dependabot PRs)"
    cmds:
      - |
        set -e
        git rev-parse --verify {{.BASE}} >/dev/null
        base=$(mktemp -d)
        trap 'git worktree remove --force "$base"' EXIT
        git worktree add --detach "$base" {{.BASE}} >/dev/null
        mkdir -p target
        for side in base head; do
          src=$PWD; [ "$side" = base ] && src=$base
          # Maven resolves the tree (BOM-managed and transitive versions); osv-scanner alone cannot.
          (cd "$src" && ./mvnw -q -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DoutputFormat=json -DoutputName=bom -DincludeTestScope=false)
          rc=0
          docker run --rm -v "$src:/src" ghcr.io/google/osv-scanner:v2.7.0 scan source -L /src/target/bom.json --format json > "target/osv-$side.json" || rc=$?
          [ "$rc" -le 1 ] || { echo "audit: osv-scanner failed on $side (exit $rc)"; exit "$rc"; }
        done
        python3 - target/osv-base.json target/osv-head.json <<'EOF'
        import json, sys
        def vulns(path):
            out = set()
            for result in json.load(open(path)).get("results") or []:
                for pkg in result.get("packages") or []:
                    name = pkg["package"]["name"]
                    for v in pkg.get("vulnerabilities") or []:
                        out.add((name, v["id"]))
            return out
        added = sorted(vulns(sys.argv[2]) - vulns(sys.argv[1]))
        for name, vid in added:
            print(f"audit: {name} adds {vid}")
        print("audit: no new vulnerable dependencies" if not added else f"audit: {len(added)} new")
        sys.exit(1 if added else 0)
        EOF

  check:pr:
    desc: "PR description has Problem and Acceptance check filled in (reads PR_BODY; locally: PR_BODY=\"$(gh pr view --json body -q .body)\" task check:pr)"
    cmds:
      - |
        python3 - <<'EOF'
        import os, re, sys
        body = re.sub(r"<!--.*?-->", "", os.environ.get("PR_BODY", ""), flags=re.S)
        sections = {m.group(1).strip().lower(): m.group(2) for m in re.finditer(r"^##\s+(.+?)\s*$(.*?)(?=^##\s|\Z)", body, re.M | re.S)}
        missing = []
        for name in ("problem", "acceptance check"):
            text = re.sub(r"^\s*Proven by:\s*$", "", sections.get(name, ""), flags=re.M).strip()
            if not text:
                missing.append(name.capitalize())
        print("pr: missing or empty: " + ", ".join(missing) if missing else "pr: Problem and Acceptance check filled in")
        sys.exit(1 if missing else 0)
        EOF

  check:diagrams:
    desc: "Mermaid-cli renders every diagram; no Mermaid pasted into Markdown"
    cmds:
      - |
        for f in docs/architecture/*.mmd; do
          [ -e "$f" ] || continue;
          docker run --rm -v "$PWD:/src" -w /src minlag/mermaid-cli:11.4.2 mmdc -i "/src/$f" -o /tmp/anvil-mmd.svg || exit 1;
        done
      - grep -r --include='*.md' '```mermaid' docs/ && exit 1 || exit 0

  check:tla:
    desc: "Model-check docs/faults/fencing.tla with TLC {{.TLC_VERSION}} (SHA-256 pinned); fails on a violation or a parse error"
    cmds:
      - |
        set -e
        mkdir -p .bin target
        jar=.bin/tla2tools-{{.TLC_VERSION}}.jar
        [ -f "$jar" ] || curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v{{.TLC_VERSION}}/tla2tools.jar
        echo "{{.TLC_SHA256}}  $jar" | sha256sum -c -
        java -XX:+UseParallelGC -cp "$jar" tlc2.TLC -metadir target/tlc -config docs/faults/fencing.cfg docs/faults/fencing.tla

  diagrams:
    desc: "Generate docs/architecture/data-model.mmd (not committed) with mermerd from the compose database"
    cmds:
      - |
        set -e
        mkdir -p .bin
        if [ ! -x .bin/mermerd ]; then
          curl -fsSL -o .bin/mermerd.tar.gz https://github.com/KarnerTh/mermerd/releases/download/v{{.MERMERD_VERSION}}/mermerd_{{.MERMERD_VERSION}}_linux_amd64.tar.gz
          echo "{{.MERMERD_SHA256}}  .bin/mermerd.tar.gz" | sha256sum -c -
          tar -xzf .bin/mermerd.tar.gz -C .bin mermerd
          rm .bin/mermerd.tar.gz
        fi
        docker compose up -d --build --wait db app
        until curl -fs localhost:8080/readyz >/dev/null; do sleep 2; done
        .bin/mermerd --connectionString "postgresql://anvil:${POSTGRES_PASSWORD:-anvil}@localhost:5432/anvil?sslmode=disable" \
          --schema public --useAllTables --showAllConstraints --outputFileName docs/architecture/data-model.mmd
        echo "wrote docs/architecture/data-model.mmd"

  verify:
    desc: "Full local gate: the same commands CI runs"
    cmds:
      - task test
      - task test:contract
      - task build
      - task check:sast
      - task check:secrets
      - task check:audit
      - task check:diagrams
      - task check:tla
