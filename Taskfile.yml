version: '3'

tasks:
  dev:
    desc: Start the system locally with dependencies (Boot Dev Services provisions Postgres)
    cmds:
      - ./mvnw spring-boot:run

  test:
    desc: "Full suite with Testcontainers and real dependencies (covers compile + migrations)"
    cmds:
      - ./mvnw -B -ntp test

  build:
    desc: Build the repeatable delivery artifact
    cmds:
      - ./mvnw -B -ntp package -DskipTests

  test:contract:
    desc: "Contract compat via oasdiff breaking --fail-on ERR (off-the-shelf; fail if origin/main missing, skip if no baseline file)"
    cmds:
      - |
        git rev-parse --verify origin/main >/dev/null || { echo "contract: origin/main not found"; exit 1; }
        git show origin/main:openapi/openapi.yaml > /tmp/anvil-base.yaml || { echo "contract: openapi/openapi.yaml not on main, skipping"; exit 0; }
        oasdiff breaking --fail-on ERR --err-ignore openapi/oasdiff-ignore.txt /tmp/anvil-base.yaml openapi/openapi.yaml

  check:sast:
    desc: "SAST via Semgrep registry p/default --error (off-the-shelf; CodeQL runs in CI as advisory)"
    cmds:
      - docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.180.0 semgrep scan --config p/default --error --metrics off src/main/java

  check:secrets:
    desc: "Secrets scan via gitleaks dir (off-the-shelf; exits 1 on leaks per gitleaks docs)"
    cmds:
      - docker run --rm -v "$PWD:/path" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /path -v

  check:audit:
    desc: "Dependency audit via osv-scanner (off-the-shelf; exits 1 on vulns per osv-scanner docs)"
    cmds:
      - docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.0 scan source -r /src --format table

  check:hygiene:
    desc: "Fail on stubs via grep (off-the-shelf)"
    cmds:
      - grep -r -E '@ORG[/]|\|\|[ ]true|echo[ ]placeholder|TODO[ ]CI|assertTrue\(true\)' Taskfile.yml .github && exit 1 || exit 0

  diagrams:
    desc: "Structurizr CLI validate + fail on pasted mermaid (off-the-shelf)"
    cmds:
      - docker run --rm -v "$PWD:/usr/local/structurizr" structurizr/cli:2025.11.09 validate -workspace docs/architecture/workspace.dsl
      - grep -r --include='*.md' '```mermaid' docs/ && exit 1 || exit 0

  verify:
    desc: "Full local gate: test (once) + contract + build + security/diagram checks"
    cmds:
      - task test
      - task test:contract
      - task build
      - task check:sast
      - task check:secrets
      - task check:audit
      - task check:hygiene
      - task diagrams
